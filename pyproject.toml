[project]
name = "code-sample-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mark Nie", email = "marknie1998@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.15.1",
    "fastapi[standard]>=0.141.1",
    "google-genai>=2.25.0",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "pypdf>=6.19.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
]

[project.scripts]
code-sample-rag = "code_sample_rag:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "integration: marks tests that hit the real GenAI API (deselect with '-m \"not integration\"')",
]
addopts = "-m 'not integration'"